<!DOCTYPE html>
<html lang="uk" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniTasker Kanban</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <div class="logo">UniTasker</div>
        <div class="header-actions">
            <input type="text" id="searchInput" class="search-input" placeholder="Пошук за назвою чи тегами..." onkeyup="filterTasks()">
            <button class="btn btn-primary" onclick="openModal()">+ Створити</button>
            <button class="btn btn-secondary" id="todayFilterBtn" onclick="toggleTodayView()"> Сьогодні</button>
            <a href="/tasks/export/csv" class="btn btn-secondary">Експорт CSV</a>
            <button class="btn btn-theme" id="themeToggleBtn" onclick="toggleTheme()">Темна тема</button>
        </div>
    </header>

    <div class="board-container">
        <div class="board">
            <div class="column" id="TODO" ondrop="drop(event)" ondragover="allowDrop(event)">
                <div class="column-header">
                    <h3>TODO</h3>
                    <span class="task-count" id="count-TODO">0</span>
                </div>
            </div>
            <div class="column" id="IN PROGRESS" ondrop="drop(event)" ondragover="allowDrop(event)">
                <div class="column-header">
                    <h3>IN PROGRESS</h3>
                    <span class="task-count" id="count-IN PROGRESS">0</span>
                </div>
            </div>
            <div class="column" id="DONE" ondrop="drop(event)" ondragover="allowDrop(event)">
                <div class="column-header">
                    <h3>DONE</h3>
                    <span class="task-count" id="count-DONE">0</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальне вікно -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Нове завдання</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="taskForm">
                <div class="form-group">
                    <label>Назва завдання</label>
                    <input type="text" id="title" class="form-control" placeholder="Наприклад: Підготувати звіт з ЛР" required>
                </div>
                <div class="form-group">
                    <label>Опис (список підзадач)</label>
                    <textarea id="description" class="form-control" rows="3" placeholder="- Пункт 1&#10;- Пункт 2"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Пріоритет</label>
                        <select id="priority" class="form-control">
                            <option value="Низький">Низький</option>
                            <option value="Середній" selected>Середній</option>
                            <option value="Високий">Високий</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Дедлайн</label>
                        <input type="date" id="deadline" class="form-control">
                    </div>
                </div>
                <div class="form-group">
                    <label>Теги (через кому)</label>
                    <input type="text" id="tags" class="form-control" placeholder="ЛР, Python, Wokwi">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Скасувати</button>
                    <button type="submit" class="btn btn-primary">Зберегти</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
